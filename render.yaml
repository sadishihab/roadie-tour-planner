# Render blueprint: Roadie as a Docker web service on the free plan.
# Secrets are entered in the Render dashboard (sync: false) and never stored in this repo.
# The private gallery JSON files (<slug>.json) are uploaded as Secret Files in the dashboard
# (combined limit 1 MB per service) and are never committed. See docs/DEPLOY.md.
services:
  - type: web
    name: roadie
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: QLOO_API_KEY
        sync: false
      # Measured (docs/DEPLOY.md, Known limits): (a) one qloo process per call took about 47 s per call at 0.1 CPU,
      # so oneshot live plans failed on this instance. (b) The persistent harness starts once (about 40 to 45 s alone,
      # about 105 s locally at 0.1 CPU) and then calls take 0.6 to 4 s. (c) Locally at 0.1 CPU a full plan took 28.7 s
      # after the warm-up, the search 46.8 s. (d) Here, once ready, search took 16.9 s and a full plan 15.4 s.
      # Not measured: a cold start with live on, a harness crash on a real host, sustained load.
      - key: ROADIE_LIVE
        value: "1"
      - key: ROADIE_QLOO_MODE
        value: persistent
      - key: ROADIE_LIVE_UNTIL
        value: "2026-11-16"
      - key: ROADIE_GLOBAL_SEARCHES_PER_DAY
        value: "50"
      - key: ROADIE_TRUST_PROXY
        value: "1"
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_TRUSTED_BASE_URL
        value: https://hackathon.api.qloo.com
